<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1 Purdue VLAN topology for OT Network Lab</title>
  <desc id="desc">Detailed Stage 1 lab topology showing Enterprise IT VLANs, Industrial DMZ VLAN 20, Site Operations VLAN 30, Supervisory VLAN 40, and Control VLAN 50.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf7ff"/>
    </linearGradient>
    <linearGradient id="enterprise" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3157ff"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="dmz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="operations" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <linearGradient id="supervisory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#be123c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#14213d" flood-opacity="0.16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3157ff"/></marker>
    <style>
      .font{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#14213d;font-weight:900;letter-spacing:-.04em}.subtitle{fill:#667085;font-weight:700}.level{fill:#fff;font-weight:900;letter-spacing:.04em}.name{fill:#fff;font-weight:900;letter-spacing:-.03em}.desc{fill:rgba(255,255,255,.84);font-weight:650}.vlan{fill:#14213d;font-weight:800}.vlanText{fill:#667085;font-weight:650}.card{rx:30;filter:url(#shadow)}.pill{fill:rgba(255,255,255,.93);stroke:rgba(255,255,255,.45);stroke-width:2}.access{fill:#3157ff;font-weight:900;letter-spacing:.08em}.icon{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.iconBg{fill:rgba(255,255,255,.16)}
    </style>
  </defs>
  <rect width="1200" height="1600" rx="40" fill="url(#pageBg)"/>
  <circle cx="120" cy="150" r="210" fill="#3157ff" opacity=".08"/>
  <circle cx="1040" cy="1330" r="260" fill="#18c8a8" opacity=".10"/>
  <text x="600" y="78" text-anchor="middle" class="font title" font-size="40">Stage 1 Purdue VLAN Topology</text>
  <text x="600" y="118" text-anchor="middle" class="font subtitle" font-size="20">First build target for the Proxmox OT Network Lab</text>

  <!-- Enterprise -->
  <g transform="translate(95 165)">
    <rect class="card" width="1010" height="310" fill="url(#enterprise)"/>
    <circle cx="80" cy="72" r="42" class="iconBg"/>
    <path class="icon" d="M54 84h52M62 84V55h36v29M71 55V42h18v13"/>
    <text x="150" y="55" class="font level" font-size="18">LEVEL 4</text>
    <text x="150" y="95" class="font name" font-size="38">Enterprise IT</text>
    <text x="150" y="130" class="font desc" font-size="18">Business network and administration services</text>
    <g transform="translate(55 170)">
      <rect class="pill" width="170" height="58" rx="18"/><text x="85" y="24" text-anchor="middle" class="font vlan" font-size="16">VLAN 10</text><text x="85" y="43" text-anchor="middle" class="font vlanText" font-size="15">HR</text>
      <g transform="translate(190 0)"><rect class="pill" width="170" height="58" rx="18"/><text x="85" y="24" text-anchor="middle" class="font vlan" font-size="16">VLAN 11</text><text x="85" y="43" text-anchor="middle" class="font vlanText" font-size="15">Finance</text></g>
      <g transform="translate(380 0)"><rect class="pill" width="170" height="58" rx="18"/><text x="85" y="24" text-anchor="middle" class="font vlan" font-size="16">VLAN 12</text><text x="85" y="43" text-anchor="middle" class="font vlanText" font-size="15">Marketing</text></g>
      <g transform="translate(570 0)"><rect class="pill" width="170" height="58" rx="18"/><text x="85" y="24" text-anchor="middle" class="font vlan" font-size="16">VLAN 13</text><text x="85" y="43" text-anchor="middle" class="font vlanText" font-size="15">IT Admin</text></g>
      <g transform="translate(760 0)"><rect class="pill" width="190" height="58" rx="18"/><text x="95" y="24" text-anchor="middle" class="font vlan" font-size="16">VLAN 14</text><text x="95" y="43" text-anchor="middle" class="font vlanText" font-size="15">Enterprise Servers</text></g>
    </g>
  </g>

  <line x1="600" y1="500" x2="600" y2="570" stroke="#3157ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="628" y="540" class="font access" font-size="14">CONTROLLED ACCESS</text>

  <!-- DMZ -->
  <g transform="translate(155 590)">
    <rect class="card" width="890" height="205" fill="url(#dmz)"/>
    <circle cx="80" cy="72" r="42" class="iconBg"/>
    <path class="icon" d="M55 48h50v34c0 24-17 36-25 41-8-5-25-17-25-41zM68 76l10 10 18-24"/>
    <text x="150" y="55" class="font level" font-size="18">LEVEL 3.5</text>
    <text x="150" y="95" class="font name" font-size="36">Industrial DMZ</text>
    <text x="150" y="130" class="font desc" font-size="18">Controlled buffer between Enterprise and Operations</text>
    <rect x="590" y="72" width="245" height="68" rx="20" class="pill"/>
    <text x="712" y="100" text-anchor="middle" class="font vlan" font-size="17">VLAN 20</text>
    <text x="712" y="123" text-anchor="middle" class="font vlanText" font-size="15">Jump Host / Historian / Proxy</text>
  </g>

  <line x1="600" y1="820" x2="600" y2="890" stroke="#3157ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="628" y="860" class="font access" font-size="14">CONTROLLED ACCESS</text>

  <!-- Operations -->
  <g transform="translate(155 910)">
    <rect class="card" width="890" height="185" fill="url(#operations)"/>
    <circle cx="80" cy="72" r="42" class="iconBg"/>
    <rect x="52" y="50" width="56" height="40" rx="8" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="5"/>
    <path class="icon" d="M63 108h34M80 90v18M63 63h34M63 76h22"/>
    <text x="150" y="55" class="font level" font-size="18">LEVEL 3</text>
    <text x="150" y="95" class="font name" font-size="36">Site Operations</text>
    <text x="150" y="130" class="font desc" font-size="18">Engineering access and operational support zone</text>
    <rect x="590" y="62" width="245" height="68" rx="20" class="pill"/>
    <text x="712" y="90" text-anchor="middle" class="font vlan" font-size="17">VLAN 30</text>
    <text x="712" y="113" text-anchor="middle" class="font vlanText" font-size="15">Engineering Workstation</text>
  </g>

  <line x1="600" y1="1120" x2="600" y2="1190" stroke="#3157ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Supervisory -->
  <g transform="translate(155 1210)">
    <rect class="card" width="890" height="165" fill="url(#supervisory)"/>
    <circle cx="80" cy="72" r="42" class="iconBg"/>
    <rect x="51" y="49" width="58" height="42" rx="8" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="5"/>
    <path class="icon" d="M63 75l10-10 10 14 13-22M68 108h24M80 91v17"/>
    <text x="150" y="55" class="font level" font-size="18">LEVEL 2</text>
    <text x="150" y="95" class="font name" font-size="36">Supervisory</text>
    <text x="150" y="130" class="font desc" font-size="18">SCADA and HMI visibility layer</text>
    <rect x="590" y="50" width="245" height="68" rx="20" class="pill"/>
    <text x="712" y="78" text-anchor="middle" class="font vlan" font-size="17">VLAN 40</text>
    <text x="712" y="101" text-anchor="middle" class="font vlanText" font-size="15">SCADA / HMI</text>
  </g>

  <line x1="600" y1="1400" x2="600" y2="1455" stroke="#3157ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Control -->
  <g transform="translate(155 1470)">
    <rect class="card" width="890" height="105" fill="url(#control)"/>
    <circle cx="80" cy="52" r="35" class="iconBg"/>
    <rect x="57" y="30" width="46" height="43" rx="8" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="4"/>
    <path class="icon" d="M68 43h24M68 56h24M68 69h8"/>
    <text x="150" y="43" class="font level" font-size="17">LEVEL 1</text>
    <text x="150" y="78" class="font name" font-size="32">Control</text>
    <rect x="590" y="27" width="245" height="58" rx="18" class="pill"/>
    <text x="712" y="51" text-anchor="middle" class="font vlan" font-size="17">VLAN 50</text>
    <text x="712" y="73" text-anchor="middle" class="font vlanText" font-size="15">PLC / Controller</text>
  </g>
</svg>
