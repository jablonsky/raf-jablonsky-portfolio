<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#4f6b8a;stroke-width:2}.sec{fill:#eef6ff;stroke:#2474c6;stroke-width:2}.line{stroke:#536579;stroke-width:4}.tag{fill:#f5f7fa;stroke:#cbd5e1}</style><rect width="1200" height="620" fill="#f7f9fc"/><text x="50" y="55" class="title">Concept B — Firewall-on-a-Stick + Centralised Policy</text><rect x="75" y="180" width="285" height="225" rx="14" class="sec"/><text x="217" y="220" text-anchor="middle" class="h">Firewall / ROAS proof</text><text x="217" y="255" text-anchor="middle" class="t">Tagged L3 subinterfaces</text><text x="217" y="290" text-anchor="middle" class="t">.110 → 10.110.10.1/24</text><text x="217" y="320" text-anchor="middle" class="t">.120 → 10.120.10.1/24</text><text x="217" y="350" text-anchor="middle" class="t">.130 / .140 / .190</text><text x="217" y="380" text-anchor="middle" class="t">Security policy point</text><line x1="360" y1="290" x2="600" y2="290" class="line"/><text x="480" y="268" text-anchor="middle" class="t">802.1Q trunk</text><rect x="600" y="230" width="190" height="120" rx="14" class="box"/><text x="695" y="275" text-anchor="middle" class="h">OT L2 Access</text><text x="695" y="305" text-anchor="middle" class="t">No inter-VLAN routing</text><line x1="790" y1="290" x2="930" y2="125" class="line"/><line x1="790" y1="290" x2="960" y2="215" class="line"/><line x1="790" y1="290" x2="960" y2="305" class="line"/><line x1="790" y1="290" x2="960" y2="395" class="line"/><line x1="790" y1="290" x2="930" y2="485" class="line"/><g class="t"><rect x="910" y="90" width="230" height="65" rx="10" class="tag"/><text x="1025" y="117" text-anchor="middle">VLAN 110 → next test 200</text><text x="1025" y="140" text-anchor="middle">Management</text><rect x="940" y="180" width="230" height="65" rx="10" class="tag"/><text x="1055" y="207" text-anchor="middle">VLAN 120 → next test 210</text><text x="1055" y="230" text-anchor="middle">Cell 1</text><rect x="940" y="270" width="230" height="65" rx="10" class="tag"/><text x="1055" y="297" text-anchor="middle">VLAN 130 → next test 220</text><text x="1055" y="320" text-anchor="middle">Cell 2</text><rect x="940" y="360" width="230" height="65" rx="10" class="tag"/><text x="1055" y="387" text-anchor="middle">VLAN 140 → next test 230</text><text x="1055" y="410" text-anchor="middle">OT Services</text><rect x="910" y="450" width="230" height="65" rx="10" class="tag"/><text x="1025" y="477" text-anchor="middle">VLAN 190 → next test 240</text><text x="1025" y="500" text-anchor="middle">Test / Engineering</text></g><text x="75" y="565" class="t">Key design decision: every cross-VLAN flow reaches the firewall, where zones and security policy can become the central enforcement model.</text></svg>